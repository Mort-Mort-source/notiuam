spring:
  application:
    name: notiuam-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/notiuam
    username: notiuam
    password: notiuam_dev_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway maneja el esquema
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: notiuam
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "mx.uam.notiuam.*"
    listener:
      ack-mode: record

  # --- Configuracion de correo ---
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_FROM_EMAIL}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.auth.mechanisms: XOAUTH2
      mail.smtp.sasl.enable: true
      mail.smtp.sasl.mechanisms: XOAUTH2

server:
  port: 8081
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:change_me_in_prod_please_use_a_very_long_random_secret_at_least_256_bits}
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

# --- Configuracion personalizada de NotiUAM ---
notiuam:
  email:
    enabled: true
    from: ${GMAIL_FROM_EMAIL}
    code-ttl-minutes: 10
    verified-ttl-minutes: 15

logging:
  level:
    mx.uam.notiuam: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO