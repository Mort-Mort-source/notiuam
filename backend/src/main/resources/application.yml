spring:
  application:
    name: notiuam-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/notiuam
    username: notiuam
    password: notiuam_dev_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway maneja el esquema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: notiuam
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "mx.uam.notiuam.*"
    listener:
      ack-mode: record

server:
  port: 8081
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:change_me_in_prod_please_use_a_very_long_random_secret_at_least_256_bits}
  expiration-ms: 3600000          # 1 hora
  refresh-expiration-ms: 604800000 # 7 días

logging:
  level:
    mx.uam.notiuam: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.kafka: INFO